plugins {
  id 'com.android.library'
  id 'kotlin-android'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundservice'
version = '1.0.0'

android {
  namespace "expo.modules.backgroundservice"

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.12.0"
}
