name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      upload:
        description: 'Upload to TestFlight / Play internal: direct (from the runner) or none'
        type: choice
        options: [direct, none]
        default: direct
      android_package:
        description: 'Android: aab (Google Play), both (AAB plus a sideload APK), apk (sideload APK only - needs upload none)'
        type: choice
        options: [aab, both, apk]
        default: aab
      version:
        description: 'Marketing version, e.g. 1.2.0 (empty = keep current). A new MAJOR.MINOR restarts the build number at 1.'
        type: string
        required: false
      bump:
        description: 'Bump the build number (1.1.0 build 3 -> build 4). Needed for every store upload of the same version.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the Android package and upload combination
        if: inputs.android_package == 'apk' && inputs.upload != 'none' && inputs.platform != 'ios'
        run: |
          echo "::error::Google Play takes the AAB, not an APK - pick upload none, or android_package both"
          exit 1

      - name: Choose the version and build number
        id: version
        env:
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          read -r version build store < <(node -e "
            const { storeBuild } = require('./scripts/store-build')
            const pkg = require('./package.json')
            const line = (v) => v.split('.').slice(0, 2).join('.')
            const version = process.env.VERSION || pkg.version
            let build = Number(pkg.buildNumber)
            if (line(version) !== line(pkg.version)) build = 1
            else if (process.env.BUMP === 'true') build += 1
            console.log(version, build, storeBuild(version, build))
          ")
          echo "Building ${version} build ${build} (store ${store})"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$PLATFORM" = "all" ]; then
            echo 'platforms=["android","ios"]' >> "$GITHUB_OUTPUT"
          else
            echo "platforms=[\"$PLATFORM\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
              /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
              /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator \
              "$AGENT_TOOLSDIRECTORY/CodeQL" "$AGENT_TOOLSDIRECTORY/go" "$AGENT_TOOLSDIRECTORY/PyPy"
            sudo docker image prune --all --force >/dev/null
          else
            keep=$(realpath "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)")
            echo "Keeping $keep"
            for xcode in /Applications/Xcode_*.app; do
              [ -L "$xcode" ] && continue
              [ "$(realpath "$xcode")" = "$keep" ] || sudo rm -rf "$xcode"
            done
            xcrun simctl delete unavailable || true
          fi
          df -h /

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(realpath "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)")
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          command -v fastlane >/dev/null || brew install fastlane
          command -v pod >/dev/null || sudo gem install cocoapods

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLATFORM: ${{ matrix.platform }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          missing=()
          [ -z "$EXPO_TOKEN" ] && missing+=(EXPO_TOKEN)
          if [ "$UPLOAD" != "none" ] && [ "$PLATFORM" = "ios" ]; then
            [ -z "$ASC_KEY_ID" ] && missing+=(ASC_KEY_ID)
            [ -z "$ASC_ISSUER_ID" ] && missing+=(ASC_ISSUER_ID)
            [ -z "$ASC_PRIVATE_KEY" ] && missing+=(ASC_PRIVATE_KEY)
          fi
          if [ "$UPLOAD" != "none" ] && [ "$PLATFORM" = "android" ]; then
            [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] && missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see the mobile release runbook, GitHub Actions section)"
            exit 1
          fi

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Give Gradle more memory
        if: runner.os == 'Linux' && matrix.platform == 'android'
        run: |
          free -h
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvmargs=-Xmx1536m"
            echo "org.gradle.workers.max=2"
          } >> ~/.gradle/gradle.properties

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm run setup

      - name: Write store credentials
        if: inputs.upload != 'none'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          umask 077
          if [ "$PLATFORM" = "ios" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            mkdir -p credentials
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > credentials/play-service-account.json
          fi

      - name: Apply the version and build number
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: node scripts/set-version.js --version "$VERSION" --build "$BUILD"

      - name: Build and upload
        env:
          PLATFORM: ${{ matrix.platform }}
          UPLOAD: ${{ inputs.upload }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
        run: |
          flags=(--platform "$PLATFORM")
          [ "$PLATFORM" = "android" ] && flags+=(--android-package "$ANDROID_PACKAGE")
          [ "$UPLOAD" = "none" ] && flags+=(--no-submit)
          node scripts/release.js "${flags[@]}"

      - name: Record the upload
        if: success() && inputs.upload != 'none'
        run: mkdir -p uploaded && echo "${{ matrix.platform }}" > uploaded/${{ matrix.platform }}

      - name: Keep the upload record
        if: success() && inputs.upload != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-${{ matrix.platform }}
          path: uploaded/
          retention-days: 1

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pear-notes-${{ matrix.platform }}
          path: |
            build/*.ipa
            build/*.aab
          if-no-files-found: ignore
          retention-days: 2

      - name: Keep the sideload APK
        if: always() && matrix.platform == 'android' && inputs.android_package != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: pear-notes-android-apk
          path: build/*.apk
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove store credentials
        if: always()
        run: rm -rf credentials/play-service-account.json ~/.appstoreconnect/private_keys

  record-version:
    needs: [prepare, build]
    if: always() && inputs.upload != 'none' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Find which platforms uploaded
        id: uploaded
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: uploaded-*
          path: uploaded
          merge-multiple: true

      - name: Decide whether to push
        id: decide
        run: |
          if [ -d uploaded ] && [ -n "$(ls -A uploaded)" ]; then
            echo "Uploaded: $(ls uploaded | tr '\n' ' ')"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "No platform uploaded; the build number is not recorded."
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.decide.outputs.push == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.decide.outputs.push == 'true'
        with:
          node-version: 24

      - name: Commit and push the release version
        if: steps.decide.outputs.push == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "$PUSH_URL" "$GITHUB_REF_NAME"
          git checkout -B release-version FETCH_HEAD
          current=$(node -p "const pkg = require('./package.json'); require('./scripts/store-build').storeBuild(pkg.version, pkg.buildNumber)")
          target=$(node -p "require('./scripts/store-build').storeBuild(process.env.VERSION, process.env.BUILD)")
          if [ "$current" -ge "$target" ]; then
            echo "The branch is already at store build ${current}, not moving it back to ${target}"
            exit 0
          fi
          node scripts/set-version.js --version "$VERSION" --build "$BUILD"
          if [ -z "$(git status --porcelain)" ]; then
            echo "The branch already has ${VERSION} (${BUILD})"
            exit 0
          fi
          git commit -am "Release ${VERSION} (${target})"
          git push "$PUSH_URL" "HEAD:${GITHUB_REF_NAME}"
