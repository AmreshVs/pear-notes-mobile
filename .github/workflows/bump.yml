name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.2.0 (empty = keep current). A new MAJOR.MINOR restarts the build number at 1.'
        type: string
        required: false
      bump:
        description: 'Bump the build number (1.1.0 build 3 -> build 4).'
        type: boolean
        default: false
      core:
        description: 'Core version from npm, e.g. 1.2.0 or latest (empty = keep current).'
        type: string
        required: false
      release_branch:
        description: 'Create the release branch vVERSION from the selected branch and make these changes there (needs a version)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      BUMP: ${{ inputs.bump }}
      CORE: ${{ inputs.core }}
      PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - name: Check there is something to bump
        if: (inputs.version == '' && !inputs.bump && inputs.core == '') || (inputs.release_branch && inputs.version == '')
        run: |
          echo "::error::Fill in a version, tick bump or name a core version. A release branch needs a version."
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create the release branch
        if: inputs.release_branch
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$VERSION\" is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          branch="v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::$branch already exists"
            exit 1
          fi
          git checkout -q -b "$branch"
          echo "TARGET=$branch" >> "$GITHUB_ENV"
          echo "Creating $branch from $GITHUB_REF_NAME"

      - name: Bump core
        if: inputs.core != ''
        run: node scripts/core-bump.js "$CORE" --lock-only

      - name: Set the version and build number
        if: inputs.version != '' || inputs.bump
        run: |
          read -r version build store < <(node -e "
            const { storeBuild } = require('./scripts/store-build')
            const pkg = require('./package.json')
            const line = (v) => v.split('.').slice(0, 2).join('.')
            const version = process.env.VERSION || pkg.version
            let build = Number(pkg.buildNumber)
            if (line(version) !== line(pkg.version)) build = 1
            else if (process.env.BUMP === 'true') build += 1
            console.log(version, build, storeBuild(version, build))
          ")
          node scripts/set-version.js --version "$version" --build "$build"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already at ${version} build ${build}"
            exit 0
          fi
          if [ -n "$TARGET" ]; then message="Start release ${version} (${store})"; else message="Set version ${version} (${store})"; fi
          git commit -qam "$message"
          echo "Set ${version} build ${build} (store ${store})"

      - name: Push
        run: git push "$PUSH_URL" "HEAD:refs/heads/${TARGET:-$GITHUB_REF_NAME}"
